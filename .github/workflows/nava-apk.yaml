name: Build Nava APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - name: Regenerate launcher icons
        run: dart run flutter_launcher_icons
      - name: Create signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/dummy.keystore \
            -storepass dummyStorePassword -keypass dummyPassword \
            -alias dummyAlias -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Nava Messenger"
      - run: flutter build apk --release
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: Nava-APK
          path: build/app/outputs/apk/release/app-release.apk
      - name: Attach APK to release
        uses: ncipollo/release-action@v1
        with:
          tag: nava-v0.1.0
          name: Nava v0.1.0
          allowUpdates: true
          prerelease: true
          artifacts: build/app/outputs/apk/release/app-release.apk
          artifactContentType: application/vnd.android.package-archive
